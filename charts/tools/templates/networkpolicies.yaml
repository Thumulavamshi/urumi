{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
# Default deny for the whole namespace, then: both servers accept only the
# gateway pods (platform namespace), and send no traffic at all — they don't
# call anything, not even DNS.
#
#   gateway (platform ns) ──8080──> fx / notes ──X
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tools.fullname" . }}-default-deny
  labels: {{- include "tools.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- range $component := list "fx" "notes" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tools.fullname" $ }}-{{ $component }}
  labels: {{- include "tools.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tools.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.mcpClients.namespace }} }
          podSelector:
            matchLabels: {{- toYaml $np.mcpClients.podLabels | nindent 14 }}
      ports:
        - { port: 8080, protocol: TCP }
  egress: []
{{- end }}
{{- end }}
{{- end }}
