{{- $fullname := include "platform.fullname" . -}}
{{- $sel := dict "ctx" . "component" "postgres" -}}
# Gateway database: users, API key hashes, server registry, audit log.
# Headless Service (stable DNS for the StatefulSet pod), never exposed.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "platform.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        {{- include "platform.selectorLabels" $sel | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70            # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "platform.postgresSecret" . }}, key: password }
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgres.user | quote }}, -d, {{ .Values.postgres.database | quote }}] }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgres.user | quote }}, -d, {{ .Values.postgres.database | quote }}] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgres.user | quote }}] }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # postgres 18 images keep PGDATA under /var/lib/postgresql/<major>/docker
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
