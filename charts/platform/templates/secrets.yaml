{{- $fullname := include "platform.fullname" . -}}
{{- if not .Values.secrets.gateway.existingSecret }}
{{- $name := include "platform.gatewaySecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations:
    # Losing the encryption key makes every stored upstream credential unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The value is itself base64 (of 32 random alphanumerics = 32 bytes, ~190 bits).
  encryption-key: {{ include "platform.randomSecretValue" (dict "ctx" . "secret" $name "key" "encryption-key" "raw" (randAlphaNum 32 | b64enc)) }}
  admin-password: {{ include "platform.randomSecretValue" (dict "ctx" . "secret" $name "key" "admin-password" "length" 20) }}
---
{{- end }}
{{- if not .Values.secrets.postgres.existingSecret }}
{{- $name := include "platform.postgresSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # the PVC outlives the release, so must its password
type: Opaque
data:
  password: {{ include "platform.randomSecretValue" (dict "ctx" . "secret" $name "key" "password" "length" 32) }}
---
{{- end }}
{{- /* Upstream credentials copied from other namespaces at install/upgrade time. */}}
{{- $copied := dict -}}
{{- range .Values.upstreams }}
{{- if and .credential (not .credential.existingSecret) .credential.copyFrom }}
{{- $src := lookup "v1" "Secret" .credential.copyFrom.namespace .credential.copyFrom.secret -}}
{{- if not (and $src $src.data (hasKey $src.data .credential.copyFrom.key)) }}
{{- fail (printf "upstream %s: Secret %s/%s (key %s) not found - install the store release first, or set credential.existingSecret" .slug .credential.copyFrom.namespace .credential.copyFrom.secret .credential.copyFrom.key) }}
{{- end }}
{{- $_ := set $copied .slug (index $src.data .credential.copyFrom.key) -}}
{{- end }}
{{- end }}
{{- if $copied }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.upstreamsSecret" . }}
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $slug, $value := $copied }}
  {{ $slug }}: {{ $value }}
  {{- end }}
{{- end }}
