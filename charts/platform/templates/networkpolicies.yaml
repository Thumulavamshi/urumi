{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "platform.fullname" . -}}
{{- $np := .Values.networkPolicy -}}
# Default deny for the whole namespace (in and out), then one allow-list per
# component:
#
#   ingress controller ──8080──> gateway ──5432──> postgres
#   ingress controller ──8080──> dashboard
#   gateway ──8080──> MCP server pods in the upstream namespaces (store, tools)
#   gateway ──443──> public internet (LLM API, external MCP servers)
#   gateway ──53──> kube-dns
#
# The gateway's egress is the network half of the SSRF defence: even if a URL
# got past the application check (src/ssrf.ts), the packets can only go to the
# upstream namespaces or to public addresses — never to the Kubernetes API,
# the node, the metadata service or other namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "platform.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "platform.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 14 }}
      ports:
        - { port: 5432, protocol: TCP }
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-gateway
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "platform.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.ingressController.namespace }} }
          podSelector:
            matchLabels: {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - { port: {{ .Values.gateway.port }}, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "platform.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 14 }}
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.dns.namespace }} }
          podSelector:
            matchLabels: {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- with $np.gatewayEgress }}
    {{- if .upstreamNamespaces }}
    # In-cluster MCP servers. Their own policies further limit who they accept.
    - to:
        {{- range .upstreamNamespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
        {{- end }}
      ports:
        {{- range .upstreamPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- end }}
    {{- if .internet.enabled }}
    # Public addresses only: the private ranges (pods, Services, nodes) and
    # link-local/metadata are carved out.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .internet.exceptCidrs | nindent 14 }}
      ports:
        {{- range .internet.ports }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-dashboard
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "platform.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.ingressController.namespace }} }
          podSelector:
            matchLabels: {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - { port: 8080, protocol: TCP }
  egress: []   # serves files; never calls anything
{{- end }}
