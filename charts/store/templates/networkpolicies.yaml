{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "store.fullname" . -}}
{{- $np := .Values.networkPolicy -}}
# Default deny for the whole namespace (in and out), then one allow-list per
# component. A pod only gets the traffic named below; anything else is dropped.
#
#   ingress controller ──80──> wordpress ──3306──> mariadb <──3306── setup job
#   gateway (platform ns) ──8080──> woo-mcp ──80──> wordpress
#   wordpress ──80/443──> public internet (optional, see values)
#   everyone that resolves names ──53──> kube-dns
#
# Kubelet probes come from the node itself and are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# MariaDB: in from WordPress and the setup Job only; never calls out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "store.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
              - { key: app.kubernetes.io/name, operator: In, values: [wordpress, setup] }
      ports:
        - { port: 3306, protocol: TCP }
  egress: []
---
# WordPress: in from the ingress controller (shoppers) and the MCP server;
# out to MariaDB, DNS and (optionally) public HTTP(S).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.ingressController.namespace }} }
          podSelector:
            matchLabels: {{- toYaml $np.ingressController.podLabels | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "store.selectorLabels" (dict "ctx" . "component" "woo-mcp") | nindent 14 }}
      ports:
        - { port: 80, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "store.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 14 }}
      ports:
        - { port: 3306, protocol: TCP }
    {{- include "store.dnsEgress" . | nindent 4 }}
    # WordPress calls its own public URL (WP-Cron, Action Scheduler, Site
    # Health loopback). On a server that request goes to the node's IP and is
    # forwarded to the ingress controller pods, so allow exactly those.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.ingressController.namespace }} }
          podSelector:
            matchLabels: {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        {{- range $np.ingressController.containerPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- with $np.wordpressInternet }}
    {{- if .enabled }}
    # WP-Cron/Action Scheduler loopback requests go to the store's own public
    # URL, and real stores call payment/shipping APIs. Public addresses only:
    # the cluster's private ranges stay closed.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .exceptCidrs | nindent 14 }}
      ports:
        {{- range .ports }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- end }}
    {{- end }}
---
# Setup Job (post-install/upgrade hook): talks to MariaDB through wp-cli only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-setup
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: setup
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "store.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 14 }}
      ports:
        - { port: 3306, protocol: TCP }
    {{- include "store.dnsEgress" . | nindent 4 }}
{{- if .Values.wooMcp.enabled }}
---
# MCP server, inbound: only gateway pods in the platform namespace.
# Outbound: only DNS and this store's WordPress — a compromised MCP server
# can't reach MariaDB, other namespaces, or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-woo-mcp
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "store.selectorLabels" (dict "ctx" . "component" "woo-mcp") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.mcpClients.namespace }} }
          podSelector:
            matchLabels: {{- toYaml $np.mcpClients.podLabels | nindent 14 }}
      ports:
        - { port: {{ .Values.wooMcp.port }}, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 14 }}
      ports:
        - { port: 80, protocol: TCP }
    {{- include "store.dnsEgress" . | nindent 4 }}
{{- end }}
{{- end }}
