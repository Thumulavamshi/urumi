{{- if .Values.wooMcp.enabled }}
{{- $fullname := include "store.fullname" . -}}
{{- $sel := dict "ctx" . "component" "woo-mcp" -}}
{{- $secretName := .Values.wooMcp.existingSecret | default (printf "%s-woo-mcp" $fullname) -}}
{{- if not .Values.wooMcp.existingSecret }}
# Inbound credential for the MCP server: the gateway stores a copy (encrypted)
# and sends it as `Authorization: Bearer`. Clients of the gateway never see it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "store.randomSecretValue" (dict "ctx" . "secret" $secretName "key" "token" "length" 48) }}
---
{{- end }}
# ClusterIP only: no Ingress, no NodePort. Reachable in-cluster, and the
# NetworkPolicy narrows that further to the gateway pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-woo-mcp
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "store.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-woo-mcp
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  selector:
    matchLabels: {{- include "store.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        {{- include "store.selectorLabels" $sel | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false   # never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: woo-mcp
          image: {{ with .Values.wooMcp.image }}{{ if .registry }}{{ .registry }}/{{ end }}{{ .repository }}:{{ .tag }}{{ end }}
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.wooMcp.port | quote }}
            - name: WC_BASE_URL
              value: "http://{{ $fullname }}-wordpress.{{ .Release.Namespace }}.svc.cluster.local"
            - name: STORE_PUBLIC_URL
              value: {{ include "store.url" . | quote }}
            - name: WC_TIMEOUT_MS
              value: {{ .Values.wooMcp.storeTimeoutMs | quote }}
            # Only the REST key Secret is mounted — never the DB password.
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "store.wcApiSecret" . }}, key: consumer-key }
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "store.wcApiSecret" . }}, key: consumer-secret }
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $secretName }}, key: token }
          ports:
            - name: http
              containerPort: {{ .Values.wooMcp.port }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.wooMcp.resources | nindent 12 }}
{{- end }}
