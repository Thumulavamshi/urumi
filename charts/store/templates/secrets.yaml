{{- $fullname := include "store.fullname" . -}}
{{- if not .Values.secrets.database.existingSecret }}
{{- $name := printf "%s-db" $fullname }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    # The MariaDB volume outlives `helm uninstall` (StatefulSet PVCs are not
    # deleted), so its password must too, or a reinstall can't log in.
    helm.sh/resource-policy: keep
type: Opaque
data:
  root-password: {{ include "store.randomSecretValue" (dict "ctx" . "secret" $name "key" "root-password" "length" 32) }}
  password: {{ include "store.randomSecretValue" (dict "ctx" . "secret" $name "key" "password" "length" 32) }}
{{- end }}
{{- if not .Values.secrets.wordpress.existingSecret }}
{{- $name := printf "%s-wordpress" $fullname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ include "store.randomSecretValue" (dict "ctx" . "secret" $name "key" "admin-password" "length" 24) }}
  {{- /* Fixed salts: wp-config is regenerated on every pod start, so random
         per-start salts would log everyone out on each restart. */}}
  {{- range list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
  {{ . }}: {{ include "store.randomSecretValue" (dict "ctx" $ "secret" $name "key" . "length" 64) }}
  {{- end }}
{{- end }}
{{- if not .Values.secrets.wcApi.existingSecret }}
{{- $name := printf "%s-wc-api" $fullname }}
---
# WooCommerce REST credentials. Mounted by the setup Job (to register the key
# in WooCommerce) and later by the WooCommerce MCP server (to use it). Nothing
# else in the cluster, and nothing outside it, ever sees these.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  consumer-key: {{ include "store.randomSecretValue" (dict "ctx" . "secret" $name "key" "consumer-key" "length" 40 "prefix" "ck_") }}
  consumer-secret: {{ include "store.randomSecretValue" (dict "ctx" . "secret" $name "key" "consumer-secret" "length" 40 "prefix" "cs_") }}
{{- end }}
