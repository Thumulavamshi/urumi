{{- $fullname := include "store.fullname" . -}}
{{- $sel := dict "ctx" . "component" "mariadb" -}}
# Headless Service: stable DNS name for the StatefulSet pod. ClusterIP-less and
# never exposed by Ingress, so the database is reachable only inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "store.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "store.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        {{- include "store.selectorLabels" $sel | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 999           # mysql group in the official image
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          args:
            - --innodb-buffer-pool-size={{ .Values.mariadb.innodbBufferPoolSize }}
            - --max-connections=100
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "store.dbSecret" . }}, key: root-password }
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "store.dbSecret" . }}, key: password }
          ports:
            - name: mysql
              containerPort: 3306
          # healthcheck.sh ships with the image and authenticates with the
          # healthcheck@localhost user the entrypoint creates on first init.
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "store.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.mariadb.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
