# Static SPA server. /api and /mcp never reach this pod: the Ingress sends them
# to the gateway. Runs as non-root (uid 101) on 8080; all writable paths are
# under /tmp, which the pod mounts as an emptyDir (root filesystem is read-only).
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Content-hashed bundles: cache forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    # Client-side routes (/keys, /invite/<token>, …) all get index.html, never cached.
    location / {
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      try_files $uri /index.html;
    }
  }
}
